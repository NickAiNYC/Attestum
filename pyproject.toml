[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robocore"
version = "0.1.0"
description = "Unattended closed-loop physical-robot execution runtime: orchestrator, WAL experiment ledger, 1 kHz flight recorder, auto-SysID."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.1"]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["robocore*"]

[tool.ruff]
line-length = 88
target-version = "py310"
